<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IL 2027 Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@700&display=swap">
<style>
/* Layout: phone-first Night deck. Segmented progress on top, one story beat per slide in a 760px column,
   Back / Next in the thumb zone, detail behind "+" taps, playable network behind selected slides only.
   Tokens: Innovation Labs design system, Night theme. Deliberately single-theme (presentation default). */
:root{
  --teal:#2BC4DB;--teal-deep:#016462;--brand:#0095AC;--purple:#C48BEA;--purple-tint:#2B1A3A;--lilac:#E8D2F5;
  --surface-page:#031E1E;--surface:#0A3433;--surface-tint:#0F4442;--surface-ink:#001A1C;
  --ink:#EAF6F6;--ink-muted:#9BBFC0;--ink-subtle:#7FA5A6;--on-action:#02201F;
  --line:#1C5654;--line-soft:#164B49;--line-control:#4A9896;
  --action:#2BC4DB;--action-soft:rgba(43,196,219,.14);
  --caution:#F2B266;--caution-soft:#3A2A12;--issue:#F2958A;--issue-soft:#3D1F1E;--positive:#74CC9A;--positive-soft:#123A2A;
  --f-display:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --slide-max:760px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-page);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:6px}

/* playable network, restrained: full on a few slides, faint elsewhere */
.net{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.18;transition:opacity .6s ease}
body[data-mesh="on"] .net{opacity:.9}
.net canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.net::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 85% at 50% 40%,rgba(3,30,30,.35) 0%,rgba(3,30,30,.82) 62%,var(--surface-page) 100%)}

.top{position:relative;z-index:2;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .3s}
.segs i.done{background:var(--brand)}
.segs i.cur{background:var(--teal)}
.chap{display:flex;justify-content:space-between;gap:12px;font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.chap b{color:var(--teal);font-weight:600}

.stage{position:relative;z-index:1;flex:1;min-height:0;touch-action:none}
.slide{pointer-events:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:20px 16px 28px;visibility:hidden;opacity:0;transform:translateX(28px);transition:opacity .35s,transform .45s cubic-bezier(.3,.1,.2,1),visibility 0s .45s;display:flex}
.slide[data-pos="before"]{transform:translateX(-28px)}
.slide[data-pos="on"]{visibility:visible;opacity:1;transform:none;transition:opacity .35s,transform .45s cubic-bezier(.3,.1,.2,1),visibility 0s}
.in{pointer-events:auto;touch-action:pan-y;margin:auto;width:100%;max-width:var(--slide-max);display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:900px){.slide{padding:32px 48px}.in{gap:22px}}

.logo svg{height:30px;width:auto;max-width:72vw;display:block}
.kick{font:600 12px/1.2 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.big{font-weight:700;font-size:clamp(30px,8.4vw,60px);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
.big em{font-style:normal;color:var(--teal)}
.big .ai{color:var(--purple)}
.cover .big{font-size:clamp(40px,11.5vw,84px);line-height:1.02;letter-spacing:-.025em}
.cover .big span{display:block}
.sub{font-size:clamp(16px,4.2vw,19.4px);color:var(--ink-muted);margin:0;max-width:60ch;text-wrap:pretty}
.sub b{color:var(--ink);font-weight:600}
.fine{font-size:12.3px;color:var(--ink-subtle);margin:0;max-width:64ch}

.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.stat,.card{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stat .n{font-weight:800;font-size:clamp(40px,10.5vw,56px);line-height:1;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap}
.stat .n small{font-size:.5em;font-weight:700;color:var(--ink-muted);letter-spacing:0}
.stat p{margin:10px 0 0;font-size:14.1px;color:var(--ink-muted)}
.src{display:block;margin-top:8px;font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.card h3{margin:0 0 6px;font-size:17px;font-weight:600;line-height:1.3}
.card p{margin:0;font-size:14.1px;color:var(--ink-muted)}
.card .src{margin:0 0 8px}

.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.col{border-radius:10px;padding:16px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
.col h3{margin:0 0 12px;font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--positive)}
.col.gap h3{color:var(--issue)}
.col.is{border-color:var(--purple);background:var(--purple-tint)}
.col.is h3{color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:6px 12px;border-radius:999px;background:var(--surface-tint);font-size:14.1px}
.col.gap .chips span{background:transparent;border:1px dashed var(--line-control);color:var(--ink-muted)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:14px;position:relative;padding-bottom:16px;min-width:0}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .num{width:40px;height:40px;border-radius:50%;background:var(--surface-tint);border:2px solid var(--brand);display:grid;place-items:center;font:600 14px/1 var(--f-mono);color:var(--teal)}
.steps li.ai .num{border-color:var(--purple);color:var(--purple);background:var(--purple-tint)}
.steps li.ai h3{color:var(--purple)}
.steps h3{margin:7px 0 2px;font-size:17px;font-weight:600;line-height:1.3}
.steps p{margin:0;font-size:14.1px;color:var(--ink-muted)}
.steps li>div{min-width:0}

.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.2px}
.flow span{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.flow span.ai{border-color:var(--purple);color:var(--purple);background:var(--purple-tint)}
.flow.not span{text-decoration:line-through;color:var(--ink-subtle);background:transparent;border-style:dashed}
.flow .lbl{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-subtle);border:0;background:none;padding:0 4px 0 0;text-decoration:none}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.tl li:last-child{border-bottom:1px solid var(--line)}
.tl .w{font:600 11.4px/1.4 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--teal)}
.tl li.est .w{color:var(--ink-subtle)}
.tl li.est .w::before{content:"";display:inline-block;width:8px;height:8px;border:1.5px dashed var(--line-control);border-radius:50%;margin-right:6px;vertical-align:0}
.tl li.key{background:linear-gradient(90deg,var(--purple-tint),transparent);border-radius:6px}
.tl li.key .w{color:var(--purple)}
.tl .t{font-size:15px;min-width:0}
.tl .t span{display:block;color:var(--ink-muted);font-size:13.2px}
@media (max-width:380px){.tl li{grid-template-columns:92px 1fr}}

.insight{border:1.5px dashed var(--caution);background:var(--caution-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.insight .il{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--caution)}
.insight p{margin:0;font-size:14.1px;color:var(--ink)}
.insight p i{font-style:normal;color:var(--ink-muted)}

.deep{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid var(--brand);border-radius:999px;font-size:13.2px;background:var(--action-soft)}
.deep .dk{color:var(--ink-muted)}
.deep .dv{font-weight:600;color:var(--teal)}
.deep::after{content:"\2197";color:var(--teal)}

.hint{display:inline-flex;align-items:center;gap:10px;font:600 12px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.hint i{display:inline-block;width:28px;height:2px;background:var(--teal);position:relative}
.hint i::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:2px solid var(--teal);border-right:2px solid var(--teal);transform:rotate(45deg)}
.tip{display:inline-flex;align-items:center;gap:8px;font:600 11px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-subtle)}
.tip b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--brand);color:var(--teal);font-weight:600;font-size:13px}
.hw{font-family:var(--f-hand);font-weight:700;font-size:30px;line-height:1;color:var(--lilac)}

.go{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.go a{display:block;background:var(--surface);border:1.5px solid var(--line);border-top:5px solid var(--brand);border-radius:10px;padding:12px 14px;min-width:0;transition:transform .2s,border-color .2s}
.go a.ai{border-top-color:var(--purple)}
.go a:hover{transform:translateY(-2px);border-color:var(--brand)}
.go b{display:block;font-weight:600;font-size:15px}
.go span{display:block;font-size:13.2px;color:var(--ink-muted);margin-top:2px}
.main-cta{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--action);color:var(--on-action);font-weight:600;border-radius:8px;padding:13px 20px;min-height:48px;font-size:15px}
.main-cta::after{content:"\2197"}

.bottom{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(3,30,30,.94)}
.bottom .ct{flex:1;text-align:center;font:600 12px/1 var(--f-mono);letter-spacing:.1em;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.nb{min-width:92px;min-height:44px;padding:12px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.nb.pri{background:var(--action);border-color:var(--action);color:var(--on-action)}
.nb:disabled{opacity:.35;cursor:default}

/* tap to open */
.tap{cursor:pointer;position:relative;-webkit-user-select:none;user-select:none}
.tap::after{content:"+";position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:1px solid var(--brand);display:grid;place-items:center;font:600 16px/1 var(--f-mono);color:var(--teal);background:var(--action-soft);transition:transform .25s,background .25s}
.tap[aria-expanded="true"]::after{transform:rotate(45deg);background:var(--teal);color:var(--on-action)}
.tap:hover{border-color:var(--brand)}
.card.tap,.stat.tap{padding-right:44px}
.steps li.tap{padding-right:34px}
.steps li.tap::after{top:6px;right:0}
.tl li.tap{padding-right:38px;grid-template-rows:auto auto}
.tl li.tap::after{top:9px;right:4px}
.xb{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s}
.xb>div{overflow:hidden;min-height:0}
.tap[aria-expanded="true"] .xb{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease,visibility 0s}
.xb p{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:14.1px;line-height:1.55;color:var(--ink)}
.more{display:flex;flex-direction:column;gap:8px}
.mk{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-subtle)}
.row{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 44px 12px 16px;min-width:0}
.row h4{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.row.tap::after{top:9px}
.more.ai .mk{color:var(--purple)}
.more.ai .row{background:var(--purple-tint);border-color:rgba(196,139,234,.4)}
.more.ai .row.tap::after{border-color:var(--purple);color:var(--purple);background:rgba(196,139,234,.12)}
.more.ai .row.tap[aria-expanded="true"]::after{background:var(--purple);color:var(--on-action)}

@media (prefers-reduced-motion:reduce){.net{display:none}.slide,.slide[data-pos="on"],.segs i,.xb,.tap::after,.go a{transition:none}}
</style>

<div class="net" aria-hidden="true"><canvas id="web"></canvas></div>
<header class="top"><div class="segs" id="segs" aria-hidden="true"></div><div class="chap"><span id="chap"></span><span id="chapn"></span></div></header>
<main class="stage" id="stage" aria-live="polite"></main>
<nav class="bottom" aria-label="Slides"><button class="nb" id="prev" type="button">Back</button><div class="ct" id="ct"></div><button class="nb pri" id="next" type="button">Next</button></nav>

<script>
function ILWeb(cv,o){
  o=o||{};
  var ctx=cv.getContext('2d'),FIX=o.fixed||null,WK=o.world||1;
  var COL=o.col||'43,196,219',HOT=o.hot||'196,139,234',GL=o.glow||'200,248,255';
  var DENS=o.density||.3,LA=o.lineA||.26;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=0,H=0,DPR=1,nodes=[],edges=[],ripples=[],grab=-1,running=false,last=0,t0=performance.now();
  var ptr={x:-999,y:-999,vx:0,vy:0,on:false};
  var cam={x:0,f:0};
  var seed=o.seed||7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
  var base=[],MAXN=Math.round(300*WK);
  for(var i=0;i<MAXN;i++)base.push([rnd(),rnd(),.6+rnd()*.8,rnd()*6.283]);

  function layout(){
    var r=cv.getBoundingClientRect();
    var nw=FIX?FIX.w:Math.round(r.width),nh=FIX?FIX.h:Math.round(r.height);
    if(nw<10||nh<10)return false;
    if(nw===W&&nh===H&&nodes.length)return true;
    W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
    var cnt=Math.min(MAXN,Math.round(DENS*(W*H)/10000*WK)),ww=W*WK;
    nodes=base.slice(0,cnt).map(function(b){var x=b[0]*ww,y=b[1]*H;return{hx:x,hy:y,x:x,y:y,vx:0,vy:0,ax:0,ay:0,d:b[2],ph:b[3],g:0,h:0};});
    edges=[];var seen={},cap=Math.max(W,H)*.45;cap*=cap;
    for(var i=0;i<nodes.length;i++){
      var a=nodes[i],ds=[];
      for(var j=0;j<nodes.length;j++){if(i!==j){var dx=a.hx-nodes[j].hx,dy=a.hy-nodes[j].hy;ds.push([dx*dx+dy*dy,j]);}}
      ds.sort(function(p,q){return p[0]-q[0];});
      for(var k=0;k<3&&k<ds.length;k++){var jj=ds[k][1],key=i<jj?i+'-'+jj:jj+'-'+i;
        if(!seen[key]&&ds[k][0]<cap){seen[key]=1;edges.push({a:i,b:jj,L:Math.sqrt(ds[k][0])});}}
    }
    return true;
  }

  function rgba(c,a){return 'rgba('+c+','+a.toFixed(3)+')';}

  function frame(now){
    if(!running)return;
    requestAnimationFrame(frame);
    if(!cv.getClientRects().length)return;
    if(!layout())return;
    var dt=Math.min(40,now-(last||now-16));last=now;
    var f=Math.max(.4,dt/16.7),t=(now-t0)/1000;
    var camT=cam.f*(WK-1)*W;cam.x+=(camT-cam.x)*Math.min(1,.08*f);
    var wpx=ptr.x+cam.x,wpy=ptr.y,R=Math.max(80,Math.min(W,H)*.22);
    var i,j,n,e,A,B;
    for(i=ripples.length-1;i>=0;i--)if(now-ripples[i].t>1900)ripples.splice(i,1);
    for(i=0;i<nodes.length;i++){
      n=nodes[i];
      var hx=n.hx+(reduce?0:Math.sin(t*.45+n.ph)*6),hy=n.hy+(reduce?0:Math.cos(t*.37+n.ph)*6);
      n.ax=(hx-n.x)*.012;n.ay=(hy-n.y)*.012;
    }
    for(i=0;i<edges.length;i++){
      e=edges[i];A=nodes[e.a];B=nodes[e.b];
      var dx=B.x-A.x,dy=B.y-A.y,L=Math.sqrt(dx*dx+dy*dy)||1,F=(L-e.L)*.01;
      A.ax+=dx/L*F;A.ay+=dy/L*F;B.ax-=dx/L*F;B.ay-=dy/L*F;
    }
    for(i=0;i<nodes.length;i++){
      n=nodes[i];
      if(ptr.on&&grab<0){
        var px=n.x-wpx,py=n.y-wpy,d=Math.sqrt(px*px+py*py)||1;
        if(d<R){var s=1-d/R,s2=s*s;n.ax+=px/d*s2*1.9+ptr.vx*s2*.05;n.ay+=py/d*s2*1.9+ptr.vy*s2*.05;if(s*.9>n.g)n.g=s*.9;}
      }
      for(j=0;j<ripples.length;j++){
        var r=ripples[j],age=(now-r.t)/1000,rad=age*(r.big?800:520),amp=1-age/1.85;
        var rx=n.x-r.x,ry=n.y-r.y,rd=Math.sqrt(rx*rx+ry*ry)||1,dl=Math.abs(rd-rad);
        if(dl<60&&amp>0){var q=(1-dl/60)*amp;n.ax+=rx/rd*q*(r.big?2.8:1.6);n.ay+=ry/rd*q*(r.big?2.8:1.6);if(q*.95>n.g)n.g=q*.95;if(q>n.h)n.h=q;}
      }
    }
    ptr.vx*=.8;ptr.vy*=.8;
    var damp=Math.pow(.88,f),gd=Math.pow(.95,f),hd=Math.pow(.93,f);
    for(i=0;i<nodes.length;i++){
      n=nodes[i];
      if(i===grab){n.x=wpx;n.y=wpy;n.vx=0;n.vy=0;n.g=1;continue;}
      n.vx=Math.max(-40,Math.min(40,(n.vx+n.ax*f)*damp));n.vy=Math.max(-40,Math.min(40,(n.vy+n.ay*f)*damp));
      n.x+=n.vx*f;n.y+=n.vy*f;n.g*=gd;n.h*=hd;
    }

    ctx.clearRect(0,0,W,H);
    var cx=cam.x,vis=function(x,y){return x-cx>-30&&x-cx<W+30&&y>-30&&y<H+30;};
    ctx.lineCap='round';
    ctx.beginPath();
    for(i=0;i<edges.length;i++){
      e=edges[i];A=nodes[e.a];B=nodes[e.b];
      if(A.g>.06||B.g>.06)continue;
      if(!vis(A.x,A.y)&&!vis(B.x,B.y))continue;
      ctx.moveTo(A.x-cx,A.y);ctx.lineTo(B.x-cx,B.y);
    }
    ctx.strokeStyle=rgba(COL,LA);ctx.lineWidth=1;ctx.stroke();
    for(i=0;i<edges.length;i++){
      e=edges[i];A=nodes[e.a];B=nodes[e.b];
      var gm=Math.max(A.g,B.g);
      if(gm<=.06)continue;
      if(!vis(A.x,A.y)&&!vis(B.x,B.y))continue;
      var hot=Math.max(A.h,B.h)>.3;
      ctx.beginPath();ctx.moveTo(A.x-cx,A.y);ctx.lineTo(B.x-cx,B.y);
      ctx.strokeStyle=rgba(hot?HOT:GL,Math.min(.95,LA+gm*.7));ctx.lineWidth=1+gm*1.4;ctx.stroke();
    }
    for(i=0;i<nodes.length;i++){
      n=nodes[i];if(!vis(n.x,n.y))continue;
      var x=n.x-cx,y=n.y,rr=1+n.d*1.2;
      if(n.g>.05||i===grab){
        var hh=n.h>.3||i===grab;
        ctx.fillStyle=rgba(hh?HOT:GL,.2*n.g);ctx.beginPath();ctx.arc(x,y,rr+4+12*n.g,0,6.283);ctx.fill();
        ctx.fillStyle=rgba(hh?HOT:GL,.5+.5*n.g);ctx.beginPath();ctx.arc(x,y,rr+1.2*n.g,0,6.283);ctx.fill();
      }else{
        ctx.fillStyle=rgba(COL,.55);ctx.beginPath();ctx.arc(x,y,rr,0,6.283);ctx.fill();
      }
    }
    if(ptr.on){
      var gr=ctx.createRadialGradient(ptr.x,ptr.y,0,ptr.x,ptr.y,R);
      gr.addColorStop(0,rgba(GL,.12));gr.addColorStop(1,rgba(GL,0));
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(ptr.x,ptr.y,R,0,6.283);ctx.fill();
    }
  }

  function pulse(sx,sy,big){ripples.push({x:sx+cam.x,y:sy,t:performance.now(),big:!!big});if(ripples.length>10)ripples.shift();}

  function bind(target,opt){
    var ign=(opt&&opt.ignore)||'a,button,[role="button"],summary,input,textarea,select';
    function pos(e){
      var r=cv.getBoundingClientRect(),kx=(FIX?FIX.w:r.width)/(r.width||1),ky=(FIX?FIX.h:r.height)/(r.height||1);
      return[(e.clientX-r.left)*kx,(e.clientY-r.top)*ky];
    }
    target.addEventListener('pointermove',function(e){
      var p=pos(e);ptr.vx=p[0]-ptr.x;ptr.vy=p[1]-ptr.y;if(!ptr.on){ptr.vx=0;ptr.vy=0;}
      ptr.x=p[0];ptr.y=p[1];ptr.on=true;
    },{passive:true});
    target.addEventListener('pointerdown',function(e){
      var p=pos(e);ptr.x=p[0];ptr.y=p[1];ptr.on=true;ptr.vx=0;ptr.vy=0;
      if(e.target.closest&&e.target.closest(ign))return;
      pulse(p[0],p[1],true);
      var best=-1,bd=48*48,wx=p[0]+cam.x;
      for(var i=0;i<nodes.length;i++){var dx=nodes[i].x-wx,dy=nodes[i].y-p[1],dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=i;}}
      grab=best;
    });
    function up(e){grab=-1;if(e.pointerType==='touch')ptr.on=false;}
    target.addEventListener('pointerup',up);
    target.addEventListener('pointercancel',up);
    target.addEventListener('pointerleave',function(){ptr.on=false;grab=-1;});
  }

  function start(){if(running)return;running=true;requestAnimationFrame(frame);}
  start();
  return{stop:function(){running=false;},pulse:pulse,bind:bind,start:start,setCam:function(f){cam.f=Math.max(0,Math.min(1,f));},isGrabbing:function(){return grab>=0;}};
}

const $=id=>document.getElementById(id);
const N=S.length;
let cur=0,first=true;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const web=reduce?null:ILWeb($('web'),{world:3.2,density:1.1,seed:7,lineA:.26});
if(web){web.bind(document);document.addEventListener('visibilitychange',()=>{document.hidden?web.stop():web.start();});}

$('stage').innerHTML=S.map((s,i)=>'<section class="slide '+(s.cls||'')+'" id="s'+i+'" aria-label="Slide '+(i+1)+' of '+N+'" data-pos="after"><div class="in">'+s.html+'</div></section>').join('');
$('segs').innerHTML=S.map(()=>'<i></i>').join('');

function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>{
    el.dataset.pos=i<cur?'before':(i>cur?'after':'on');
    el.setAttribute('aria-hidden',i===cur?'false':'true');
    if(i===cur)el.scrollTop=0;
    else el.querySelectorAll('.tap[aria-expanded="true"]').forEach(t=>t.setAttribute('aria-expanded','false'));
  });
  document.querySelectorAll('#segs i').forEach((el,i)=>{el.className=i<cur?'done':(i===cur?'cur':'');});
  document.body.dataset.mesh=S[cur].mesh||'low';
  $('chap').innerHTML='<b>'+S[cur].ch+'</b>';
  $('chapn').textContent=String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  $('prev').disabled=cur===0;
  $('next').disabled=cur===N-1;
  $('next').textContent=cur===0?'Start':'Next';
  if(web){web.setCam(cur/(N-1));if(!first&&S[cur].mesh==='on')web.pulse(innerWidth/2,innerHeight*.45,true);}
  first=false;
  try{history.replaceState(null,'','#'+(cur+1));}catch(e){}
}
function go(i){cur=Math.max(0,Math.min(N-1,i));render();}
$('prev').addEventListener('click',()=>go(cur-1));
$('next').addEventListener('click',()=>go(cur+1));
function toggle(el){
  const open=el.getAttribute('aria-expanded')!=='true';
  el.setAttribute('aria-expanded',open?'true':'false');
  if(open)setTimeout(()=>{try{el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}catch(e){}},320);
}
$('stage').addEventListener('click',e=>{if(e.target.closest('a'))return;const t=e.target.closest('.tap');if(t)toggle(t);});
document.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.tap');
  if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle(t);return;}
  if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(N-1);
});
let tx=0,ty=0,tt=0,noNav=false;
$('stage').addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();noNav=web?web.isGrabbing():false;},{passive:true});
$('stage').addEventListener('touchend',e=>{
  if(noNav)return;
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5&&Date.now()-tt<900)go(dx<0?cur+1:cur-1);
},{passive:true});
const n0=parseInt((location.hash||'').replace('#',''),10);if(n0>=1&&n0<=N)cur=n0-1;
window.addEventListener('hashchange',()=>{const n=parseInt((location.hash||'').replace('#',''),10);if(n>=1&&n<=N&&n-1!==cur){cur=n-1;render();}});
render();
</script>
