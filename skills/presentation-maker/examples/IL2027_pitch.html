<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Innovation Labs 2027 · Analog First, AI Second · Route Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Caveat:wght@700&display=swap">
<style>
/* Innovation Labs presentation, route first.
   Layout: phone-first deck. Slide 1 is the 2027 route (serpentine on wide screens and sideways phones,
   vertical journey with a bottom sheet on a portrait phone). Every later slide carries its stop number.
   Look: Strategy Hub tokens, Night by default, Light and purple or yellow accent on a switch. */
/* Innovation Labs tokens v0.4
   Look = the Strategy Hub (teal band, big Poppins, serpentine route, soft panels).
   Two axes switch the same layout:
     data-theme  = light | night
     data-accent = purple | yellow     (the accent role: new, AI, current step, focus, hand note)
   Gradients are tokens now. See BRAND_ELEMENTS.md for when to use them. */

:root,
[data-theme="light"] {
  /* brand */
  --teal: #0095AC;
  --teal-deep: #016462;
  --teal-ink: #016462;
  --header: #007F86;          /* top band */
  --hero-a: #068499;          /* hero gradient start */
  --hero-b: #065F5C;          /* hero gradient end */
  --bright: #72ECE7;          /* highlight words on teal fields */
  --route: #0095AC;
  --logo-ink: #2B6363;

  /* surfaces (flat: alternate page / alt / tint) */
  --surface-page: #FFFFFF;
  --surface-alt: #F4FBFB;
  --surface: #FFFFFF;
  --surface-tint: #EAF7F7;
  --surface-ink: #10201F;

  /* text */
  --ink: #10201F;
  --ink-muted: #3C5052;
  --ink-subtle: #4A5E60;
  --on-brand: #FFFFFF;

  /* lines */
  --line: #D6E4E5;
  --line-soft: #E3EDEE;
  --line-control: #6F8689;
  --line-strong: #9CC3C6;

  /* actions */
  --action: #007A8C;
  --on-action: #FFFFFF;
  --action-soft: rgba(0,149,172,.12);
  --focus-ring: var(--ax);

  /* accent role, default purple */
  --ax: #954BBC;
  --ax-ink: #6B2E8C;
  --ax-tint: #F1E7F8;
  --ax-soft: rgba(149,75,188,.14);
  --ax-on: #FFFFFF;
  --ax-deep: #6B2E8C;
  --ax-grad: linear-gradient(115deg, #A45CC9 0%, #6B2E8C 100%);
  --lilac: #E8D2F5;

  /* status */
  --positive: #2D7A57; --positive-soft: #E6F4EC;
  --caution: #7A5200;  --caution-soft: #FFF3D6;
  --issue: #A8453A;    --issue-soft: #FBECE9;

  /* data viz */
  --viz-1: #0095AC; --viz-2: #016462; --viz-ai: var(--ax); --viz-context: #AFC0C3; --viz-grid: #D3DEE0;

  /* gradients */
  --grad-brand: linear-gradient(115deg, var(--hero-a), var(--hero-b));
  --grad-band: linear-gradient(115deg, var(--header), #006B6E);
  --grad-accent: var(--ax-grad);
  --grad-surface: linear-gradient(180deg, #F4FBFB 0%, #E4F4F4 100%);
  --mesh-blue:
    radial-gradient(60% 55% at 38% 0%, #B8E3EC 0%, transparent 72%),
    radial-gradient(55% 60% at 0% 100%, #94D4DC 0%, transparent 72%),
    radial-gradient(55% 60% at 100% 100%, #90D4DE 0%, transparent 72%),
    radial-gradient(35% 40% at 100% 40%, #C5E8EF 0%, transparent 70%), #FFFFFF;
  --mesh-green:
    radial-gradient(60% 55% at 40% 0%, #A9DAC2 0%, transparent 72%),
    radial-gradient(55% 60% at 0% 100%, #83C3A4 0%, transparent 72%),
    radial-gradient(55% 60% at 100% 85%, #91D1B3 0%, transparent 72%),
    radial-gradient(40% 40% at 0% 25%, #CEE9DE 0%, transparent 70%), #FFFFFF;
  --mesh-yellow:
    radial-gradient(55% 50% at 35% 0%, #FDD49F 0%, transparent 72%),
    radial-gradient(55% 60% at 0% 100%, #FAB579 0%, transparent 72%),
    radial-gradient(55% 60% at 100% 100%, #FBBF45 0%, transparent 70%),
    radial-gradient(40% 45% at 100% 40%, #FDD2AD 0%, transparent 70%),
    radial-gradient(45% 40% at 0% 0%, #FEFAD2 0%, transparent 70%), #FFFEF6;
  --mesh-purple:
    radial-gradient(55% 55% at 0% 0%, #E2DCED 0%, transparent 70%),
    radial-gradient(55% 60% at 0% 100%, #BBABD3 0%, transparent 72%),
    radial-gradient(55% 60% at 100% 100%, #A794C6 0%, transparent 72%),
    radial-gradient(35% 40% at 100% 40%, #E7DBEB 0%, transparent 70%), #FFFFFF;
  --mesh-classic:
    radial-gradient(45% 45% at 0% 100%, #0095AC 0%, transparent 70%),
    radial-gradient(40% 40% at 100% 0%, #6FCFDD 0%, transparent 70%),
    radial-gradient(40% 40% at 0% 15%, #C9B8F0 0%, transparent 70%),
    radial-gradient(40% 40% at 100% 100%, #B79AE6 0%, transparent 70%),
    radial-gradient(40% 35% at 45% 60%, #C9F3E6 0%, transparent 70%), #FFFFFF;
  --mesh: var(--mesh-blue);   /* default page mesh; the accent swaps it, see below */

  /* spacing */
  --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-18: 18px;
  --space-22: 22px; --space-26: 26px; --space-40: 40px; --space-48: 48px; --space-64: 64px; --space-88: 88px;

  /* radius (hub look: roomy) */
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-row: 14px;
  --radius-lg: 18px; --radius-panel: 22px; --radius-xl: 24px; --radius-pill: 999px;

  --border-card: 1px; --border-accent: 5px; --border-focus: 3px;
  --content-max: 1180px; --text-max: 780px; --slide-max: 760px; --nav-height: 58px;

  --shadow-hover: 0 10px 28px rgba(1,100,98,.13);
  --shadow-nav: 0 2px 14px rgba(16,32,31,.25);
  --shadow-raised: 0 14px 40px rgba(1,100,98,.13);
  --shadow-sheet: 0 -14px 40px rgba(16,32,31,.28);

  --font: Poppins, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --hand: Caveat, "Segoe Print", "Bradley Hand", cursive;
}

/* Yellow accent. Fill is the template yellow, ink is a dark gold that holds 4.5:1 on white,
   and the label on a yellow fill is dark, never white. */
[data-accent="purple"] { --mesh: var(--mesh-purple); }
[data-accent="yellow"] {
  --ax: #FBBF45;
  --ax-ink: #7A4B00;
  --ax-tint: #FFF6DA;
  --ax-soft: rgba(251,191,69,.22);
  --ax-on: #10201F;
  --ax-deep: #BF822B;
  --ax-grad: linear-gradient(115deg, #FDD49F 0%, #FBBF45 55%, #F9A751 100%);
  --lilac: #FEFAD2;
  --focus-ring: #BF822B;
  --mesh: var(--mesh-yellow);
}

[data-theme="night"] {
  --teal: #2BC4DB;
  --teal-deep: #016462;
  --teal-ink: #72ECE7;
  --header: #061B1B;
  --hero-a: #0B8F91;
  --hero-b: #073A39;
  --bright: #72ECE7;
  --route: #72ECE7;
  --logo-ink: #FFFFFF;

  --surface-page: #061B1B;
  --surface-alt: #0A2928;
  --surface: #0D3A39;
  --surface-tint: #0F4443;
  --surface-ink: #001A1C;

  --ink: #FFFFFF;
  --ink-muted: #B9CECE;
  --ink-subtle: #8FB1B2;

  --line: rgba(195,240,240,.16);
  --line-soft: rgba(195,240,240,.10);
  --line-control: rgba(195,240,240,.38);
  --line-strong: rgba(195,240,240,.38);

  --action: #1AB7BE;
  --on-action: #04201F;
  --action-soft: rgba(43,196,219,.14);

  --ax: #C48BEA;
  --ax-ink: #D2A8EE;
  --ax-tint: rgba(149,75,188,.22);
  --ax-soft: rgba(196,139,234,.18);
  --ax-on: #1B0F26;
  --ax-deep: #954BBC;
  --ax-grad: linear-gradient(115deg, #C48BEA 0%, #954BBC 100%);

  --positive: #8FD3B1; --positive-soft: rgba(45,122,87,.26);
  --caution: #F2D58A;  --caution-soft: rgba(160,120,20,.24);
  --issue: #F1A39A;    --issue-soft: rgba(176,74,63,.22);

  --viz-2: #8FD8E4; --viz-context: #3E6E6C;

  --grad-band: linear-gradient(115deg, #061B1B, #0A2928);
  --grad-surface: linear-gradient(180deg, #061B1B 0%, #0A2928 100%);
  /* Night meshes are teal glows on near-black teal. */
  --mesh-night:
    radial-gradient(60% 55% at 15% 0%, rgba(11,143,145,.55) 0%, transparent 70%),
    radial-gradient(55% 60% at 100% 100%, rgba(7,58,57,.9) 0%, transparent 72%), #061B1B;
  --mesh: var(--mesh-night);

  --shadow-hover: 0 10px 28px rgba(0,0,0,.40);
  --shadow-nav: 0 2px 14px rgba(0,0,0,.45);
  --shadow-raised: 0 14px 40px rgba(0,0,0,.45);
  --shadow-sheet: 0 -14px 40px rgba(0,0,0,.50);
}
[data-theme="night"][data-accent="yellow"] {
  --ax: #FBBF45;
  --ax-ink: #F6D27A;
  --ax-tint: rgba(251,191,69,.16);
  --ax-soft: rgba(251,191,69,.18);
  --ax-on: #2A1B00;
  --ax-deep: #BF822B;
  --ax-grad: linear-gradient(115deg, #FBBF45 0%, #F9A751 100%);
  --focus-ring: #FBBF45;
  --lilac: #FEFAD2;
}

/* Aliases so v0.3 files keep working. Prefer the new names. */
:root, [data-theme] {
  --purple: var(--ax);
  --purple-ink: var(--ax-ink);
  --purple-tint: var(--ax-tint);
}

/* ===== Layout and components, one fluid layer =====
   Every size comes from one unit, --u, set on body.
   Landscape: --u follows the smaller of width and height, so a laptop, a projector and a sideways phone all fit one slide per screen.
   Portrait: --u follows width only and slides scroll.
   fitContent() may lower --k a little when a slide is taller than the screen. Nothing here uses !important. */
:root{--brand:#0095AC;--on-grad:#fff;color-scheme:dark}
[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{background:#061B1B;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{
  --k:1;
  --u:calc(clamp(7.5px, min(.6vw + 3px, 1.55vh), 12.5px) * var(--k));
  --pl:clamp(14px, 2.2vw, 36px);
  --pr:clamp(58px, 4.5vw, 76px);
  --pt:calc(var(--u) * 1.6);
  --pb:calc(var(--u) * 1.6);
  --tm:max(22px, calc(var(--u) * 2.2));
  margin:0;display:flex;flex-direction:row;
  background:var(--surface-page);color:var(--ink);
  font-family:var(--font);font-size:calc(var(--u) * 1.4);line-height:1.5;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
@media (orientation:portrait){
  body{
    --u:calc(clamp(9px, 2.5vw, 12px) * var(--k));
    --pl:14px;--pr:16px;
    --pb:calc(72px + env(safe-area-inset-bottom,0px));
  }
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px;border-radius:6px}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* background network */
.net{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.4;transition:opacity .6s ease}
body[data-mesh="on"] .net{opacity:.95}
body[data-mesh="off"] .net{opacity:.12}
.net canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.net::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 85% at 50% 40%,transparent 0%,color-mix(in srgb,var(--surface-page) 80%,transparent) 62%,var(--surface-page) 100%)}

/* left rail: one dot per stop */
.strip{position:relative;z-index:3;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:calc(36px + env(safe-area-inset-left,0px));padding:10px 0 10px env(safe-area-inset-left,0px)}
.strip .sb{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-control);background:transparent;color:var(--ink-muted);font:600 10.5px/1 var(--mono);display:grid;place-items:center;padding:0;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.strip .ln{flex:1 1 0;width:2px;min-height:2px;max-height:26px;background:var(--line)}
.strip .ln.done{background:var(--brand)}
.strip .sb.done{background:var(--action);border-color:var(--action);color:var(--on-action)}
.strip .sb.cur{background:var(--ax);border-color:var(--ax);color:var(--ax-on);transform:scale(1.15);box-shadow:0 0 0 4px var(--ax-soft)}
.strip.all .sb{border-color:var(--brand);color:var(--teal-ink)}

/* right controls: full screen on top, previous and next centred on the rail */
.fsb,.pn{position:fixed;z-index:61;right:calc(12px + env(safe-area-inset-right,0px));width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:color-mix(in srgb,var(--surface-page) 70%,transparent);color:var(--ink-muted);display:grid;place-items:center;padding:0;cursor:pointer;opacity:.75}
.fsb{top:calc(10px + env(safe-area-inset-top,0px))}
.pn{font:600 20px/1 var(--mono)}
#pv{top:calc(50% - 42px)}
#nx{top:calc(50% + 6px)}
.fsb:hover,.pn:hover,.pn:active{opacity:1;color:var(--ink)}
.pn:disabled{opacity:.2;cursor:default}
.fsb[hidden]{display:none}
@media (orientation:portrait){
  .fsb,.pn{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:44px;height:44px;opacity:.9}
  #nx{top:auto;right:calc(14px + env(safe-area-inset-right,0px))}
  #pv{top:auto;right:calc(66px + env(safe-area-inset-right,0px))}
  .fsb{right:calc(118px + env(safe-area-inset-right,0px))}
}

/* presenter sync pill */
.sync{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(58px + env(safe-area-inset-right,0px));z-index:60;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:4px 6px 4px 12px;font:600 11px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.sync[hidden]{display:none}
.sync .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:8px;box-shadow:0 0 8px var(--teal)}
.sync.live .dot{background:var(--ax);box-shadow:0 0 8px var(--ax)}
.sync button{border:1px solid var(--brand);background:var(--action-soft);color:var(--teal-ink);border-radius:999px;padding:6px 12px;font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.sync button.on{background:var(--ax);border-color:var(--ax);color:var(--ax-on)}
@media (orientation:portrait){.sync{right:calc(12px + env(safe-area-inset-right,0px))}}

/* "turn your phone" note, portrait only, sits above the bottom controls */
#turn{display:none;position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:300;background:var(--surface);color:var(--ink-muted);border:1px solid var(--line-strong);border-radius:14px;padding:10px 14px;font-size:13px;align-items:center;gap:10px;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#turn button{border:0;background:none;color:var(--ink);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
@media (orientation:portrait) and (max-width:900px){#turn{display:flex}#turn.off{display:none}}

/* stage and slides */
.stage{position:relative;z-index:1;flex:1;min-width:0;min-height:0;touch-action:none;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;overflow-y:auto;overflow-x:hidden;padding:var(--pt) var(--pr) var(--pb) var(--pl);pointer-events:none;visibility:hidden;opacity:0;transform:translateX(28px);transition:opacity .35s,transform .45s cubic-bezier(.3,.1,.2,1),visibility 0s .45s}
.slide[data-pos="before"]{transform:translateX(-28px)}
.slide[data-pos="on"]{visibility:visible;opacity:1;transform:none;transition:opacity .35s,transform .45s cubic-bezier(.3,.1,.2,1),visibility 0s}
.in{pointer-events:auto;touch-action:pan-y;position:relative;margin:auto;width:100%;max-width:min(100%, calc(var(--u) * 76));min-width:0;display:flex;flex-direction:column;gap:calc(var(--u) * 1.3)}
.in>*{position:relative;z-index:1;min-width:0}

/* type */
.kick{margin:0;font:600 max(10px, calc(var(--u) * 1.05))/1.3 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--teal-ink)}
.big{margin:0;font-weight:700;font-size:min(calc(var(--u) * 3.4), 9.5vw);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.cover .big{font-size:min(calc(var(--u) * 4.8), 11vw);line-height:1.04}
.big em{font-style:normal;color:var(--teal-ink)}
.big .ai{color:var(--ax-ink)}
.hw{font-family:var(--hand);font-weight:700;letter-spacing:0;font-size:1.18em;line-height:1;color:var(--ax-ink)}
.sub{margin:0;max-width:60ch;font-size:calc(var(--u) * 1.6);line-height:1.45;color:var(--ink-muted);text-wrap:pretty}
.sub b{color:var(--ink);font-weight:600}
.fine{margin:0;max-width:66ch;font-size:max(11px, calc(var(--u) * 1.15));color:var(--ink-subtle)}
.hint,.tip,.loopback{display:inline-flex;align-items:center;gap:calc(var(--u) * .8);font:600 max(10px, calc(var(--u) * 1))/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.tip{color:var(--ink-subtle)}
.tip b{flex:none;display:inline-grid;place-items:center;width:max(18px, calc(var(--u) * 1.8));height:max(18px, calc(var(--u) * 1.8));border-radius:50%;border:1px solid var(--brand);color:var(--teal-ink);font-size:max(12px, calc(var(--u) * 1.2))}
.loopback svg{flex:none;width:max(18px, calc(var(--u) * 2.2));height:max(18px, calc(var(--u) * 2.2))}

/* shared box */
.stat,.card,.col,.row{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--u) * 1.2);padding:calc(var(--u) * 1.2) calc(var(--u) * 1.4)}
.stat p,.card p,.steps p,.col p,.xb p{margin:0;font-size:calc(var(--u) * 1.35);line-height:1.45;color:var(--ink-muted)}
.card h3,.steps h3{margin:0 0 calc(var(--u) * .4);font-size:calc(var(--u) * 1.55);font-weight:600;line-height:1.3}

/* stats and cards: as many columns as fit */
.stats,.cards{display:grid;gap:calc(var(--u) * 1.1);grid-template-columns:repeat(auto-fit, minmax(min(100%, calc(var(--u) * 19)), 1fr))}
.stat .n{font-weight:800;font-size:calc(var(--u) * 3.6);line-height:1;color:var(--teal-ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat .n small{font-size:.5em;font-weight:700;color:var(--ink-muted);letter-spacing:0}
.stat p{margin-top:calc(var(--u) * .8)}
.stat .src{display:block;margin-top:calc(var(--u) * .7);font:500 max(9.5px, calc(var(--u) * .95))/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle)}

/* numbered steps */
.steps{--sn:max(30px, calc(var(--u) * 3.4));list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{position:relative;display:grid;grid-template-columns:var(--sn) minmax(0,1fr);column-gap:calc(var(--u) * 1.3);padding-bottom:calc(var(--u) * 1.2)}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:calc(var(--sn) / 2 - 1px);top:var(--sn);bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li>div{grid-column:2;min-width:0}
.steps .num{width:var(--sn);height:var(--sn);border-radius:50%;background:var(--surface-tint);border:2px solid var(--brand);display:grid;place-items:center;font:600 max(12px, calc(var(--u) * 1.3))/1 var(--mono);color:var(--teal-ink)}
.steps h3{margin:calc((var(--sn) - var(--u) * 1.55 * 1.3) / 2) 0 calc(var(--u) * .2)}
.steps li.ai .num{border-color:var(--ax);color:var(--ax-ink);background:var(--ax-tint)}
.steps li.ai h3{color:var(--ax-ink)}
.steps .tag{display:inline-block;margin-left:calc(var(--u) * .6);padding:calc(var(--u) * .3) calc(var(--u) * .5);border:1px solid var(--ax);border-radius:4px;font:600 max(9px, calc(var(--u) * .9))/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ax-ink);vertical-align:middle}

/* is / is not */
.two{display:grid;gap:calc(var(--u) * 1.1);grid-template-columns:repeat(auto-fit, minmax(min(100%, calc(var(--u) * 26)), 1fr))}
.col h3{margin:0 0 calc(var(--u) * .9);font:600 max(10px, calc(var(--u) * 1.1))/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.col.is{border-color:var(--ax);background:var(--ax-tint)}
.col.is h3{color:var(--ax-ink)}

<script>
/* ILWeb: a springy, touchable network on a canvas.
   Nodes hold a home position, are tied to their nearest neighbours by springs, get pushed by the pointer,
   can be grabbed and dragged, and light up in waves when you tap. */
function ILWeb(cv,o){
  o=o||{};
  var ctx=cv.getContext('2d'),FIX=o.fixed||null,WK=o.world||1;
  var COL=o.col||'43,196,219',HOT=o.hot||'196,139,234',GL=o.glow||'200,248,255';

  var ptr={x:-999,y:-999,vx:0,vy:0,on:false};

  function layout(){
    var r=cv.getBoundingClientRect();
    var nw=FIX?FIX.w:Math.round(r.width),nh=FIX?FIX.h:Math.round(r.height);
    if(nw<10||nh<10)return false;
    if(nw===W&&nh===H&&nodes.length)return true;
    W=nw;H=nh;DPR=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);

    edges=[];var seen={},cap=Math.max(W,H)*.45;cap*=cap;
    for(var i=0;i<nodes.length;i++){
      var a=nodes[i],ds=[];
      for(var j=0;j<nodes.length;j++){if(i!==j){var dx=a.hx-nodes[j].hx,dy=a.hy-nodes[j].hy;ds.push([dx*dx+dy*dy,j]);}}

      n=nodes[i];

(function(){

   'Paper and walls':[[[0,0,2]],[[0,2,5],1],[2]],

    const title=h.textContent.trim();

    const kids=[...d.children],kick=kids.find(c=>c.classList.contains('kick'));
    const hi=kids.indexOf(h);
    const deepEl=kids.find(c=>c.classList.contains('deep'));
    const rest=kids.filter((c,i)=>i>hi&&c!==deepEl);
    const plan=PLAN[key],n=plan.length;
    plan.forEach((piece,pi)=>{
      let html='';
      const k=kick.cloneNode(true);if(pi>0)k.textContent=kick.textContent+' ('+(pi+1)+'/'+n+')';else k.textContent=kick.textContent+' (1/'+n+')';
      html+=k.outerHTML+h.outerHTML;
      piece.forEach(it=>{
        if(Array.isArray(it)){
          const src=rest[it[0]],c=src.cloneNode(true);

          [...c.children].forEach((x,xi)=>{if(xi<it[1]||xi>=it[2])x.remove();});
          html+=c.outerHTML;
        }else html+=rest[it].outerHTML;
      });
      if(deepEl)html+=deepEl.outerHTML;
      out.push(Object.assign({},sl,{html}));

  });
  S.splice(0,S.length,...out);
})();

const useSheet=()=>document.body.classList.contains('land')||(matchMedia('(max-width:819px) and (orientation:portrait)').matches);

/* orientation: phones turned sideways get the full route and compact chrome */
function fit(){

}
(function(){var x=document.getElementById('turnx');if(x)x.onclick=function(){document.getElementById('turn').classList.add('off')};})();

}

['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{$('fsb').setAttribute('aria-label',fsEl()?'Exit full screen':'Full screen');setTimeout(()=>{fit();fitContent();},150);}));

let tx=0,ty=0,tt=0,lx=0,ly=0,sw=false;
